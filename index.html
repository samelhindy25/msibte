<style>
:root{
  --bg:#F7F7F5; --ink:#0A0A0A; --soft:#74746F; --line:#DCDCD7; --card:#FFFFFF;
  --accent:#B8862F;            /* warm brass, like a lens ring */
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  overflow:hidden; position:relative;
}

/* ---------- drifting studio light ---------- */
.light{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0}
.light span{position:absolute; border-radius:50%; filter:blur(70px); opacity:.55}
.light .a{width:46vmax; height:46vmax; background:#FFFFFF; top:-14vmax; left:-10vmax; animation:driftA 18s ease-in-out infinite alternate}
.light .b{width:38vmax; height:38vmax; background:#EDE3D2; bottom:-16vmax; right:-12vmax; opacity:.6; animation:driftB 22s ease-in-out infinite alternate}
@keyframes driftA{to{transform:translate(18vw,14vh)}}
@keyframes driftB{to{transform:translate(-16vw,-12vh)}}

/* ---------- layout ---------- */
.stage{
  position:relative; z-index:1; height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:28px 22px; text-align:center;
}

.go .logo{animation:write 2.2s cubic-bezier(.65,.05,.36,1) 1.5s forwards}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
/* the "pen" light that travels with the reveal */
.pen{
  position:absolute; top:-6%; bottom:-6%; left:0; width:3px; border-radius:3px;
  background:linear-gradient(transparent,var(--accent),transparent);
  opacity:0;
}
.go .pen{animation:pen 2.2s cubic-bezier(.65,.05,.36,1) 1.5s forwards}
@keyframes pen{0%{left:0;opacity:1}92%{opacity:1}100%{left:100%;opacity:0}}

/* ---------- text ---------- */
.reveal{opacity:0; transform:translateY(14px)}
.go .reveal{animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
.go .r1{animation-delay:3.6s}.go .r2{animation-delay:3.8s}.go .r3{animation-delay:4s}.go .r4{animation-delay:4.2s}
@keyframes up{to{opacity:1; transform:none}}

.badge{
  display:inline-flex; align-items:center; gap:10px; margin-top:clamp(34px,6vh,56px);
  padding:8px 16px 8px 12px; border-radius:999px; background:var(--card);
  border:1px solid var(--line); font-size:14px; font-weight:600; color:var(--ink);
  box-shadow:0 6px 24px -12px rgba(60,50,30,.35);
}
.rec{position:relative; width:10px; height:10px; border-radius:50%; background:var(--accent)}
.rec::after{content:""; position:absolute; inset:-5px; border-radius:50%; border:2px solid var(--accent); opacity:0; animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.4);opacity:0}}

h1{margin-top:18px; font-size:clamp(28px,4.6vw,46px); font-weight:700; letter-spacing:-.025em; line-height:1.1}
.sub{margin-top:12px; max-width:34ch; margin-inline:auto; font-size:clamp(16px,2vw,18px); line-height:1.55; color:var(--soft)}

/* progress line */
.progress{width:min(70vw,260px); height:3px; margin:28px auto 0; border-radius:3px; background:var(--line); overflow:hidden; position:relative}
.progress::after{content:""; position:absolute; top:0; bottom:0; width:40%; border-radius:3px; background:var(--ink); animation:load 1.8s cubic-bezier(.6,0,.3,1) infinite}
@keyframes load{0%{left:-40%}100%{left:100%}}

footer{position:absolute; left:0; right:0; bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:1; text-align:center; font-size:13px; color:var(--soft)}
footer a{color:inherit; text-underline-offset:3px}
footer a:hover{color:var(--ink)}
a:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:2px}

/* ---------- aperture intro ---------- */
.iris{position:fixed; inset:0; z-index:20; pointer-events:none}
.iris svg{width:100%; height:100%; display:block}
.iris .blades{transform-origin:0 0; transform:rotate(-70deg) scale(.02)}
.go .iris .blades{animation:open 1.6s cubic-bezier(.7,0,.2,1) .3s forwards}
@keyframes open{
  0%{transform:rotate(-70deg) scale(.02)}
  25%{transform:rotate(-48deg) scale(.16)}
  100%{transform:rotate(0deg) scale(2.6)}
}
.go .iris{animation:hide 0s linear 1.95s forwards}
@keyframes hide{to{visibility:hidden}}

@media (max-width:560px){
  .logo-wrap{width:90vw}
  footer{font-size:12px; padding:0 16px}
}
@media (max-height:560px){
  .badge{margin-top:20px}
  .progress{margin-top:18px}
}
@media (prefers-reduced-motion:reduce){
  .light span,.rec::after,.progress::after{animation:none}
  .iris{display:none}
  .logo,.go .logo{animation:none; clip-path:none}
  .pen{display:none}
  .reveal,.go .reveal{animation:none; opacity:1; transform:none}
}
</style>
</head>
<body>

<div class="light" aria-hidden="true"><span class="a"></span><span class="b"></span></div>

<main class="stage">
  <div class="logo-wrap" id="logoWrap">
    <div class="logo" role="img" aria-label="Saad Ramadan Photography" id="logo"></div>
    <span class="pen" aria-hidden="true"></span>
  </div>

  <div class="badge reveal r1"><span class="rec"></span>Website coming soon</div>
  <h1 class="reveal r2">Our new website is on its way.</h1>
  <p class="sub reveal r3">We’re preparing a new home for Saad Ramadan’s portfolio. Check back very soon.</p>
  <div class="progress reveal r4" role="progressbar" aria-label="Website in progress"></div>
</main>

<footer class="reveal r4">Website by <a href="https://colartdigitalmarketingagency.com" target="_blank" rel="noopener">Colart Digital Marketing Agency</a></footer>

<!-- aperture: a hexagonal opening with blade edges, rotating open -->
<div class="iris" aria-hidden="true">
  <svg viewBox="-100 -100 200 200" preserveAspectRatio="xMidYMid slice">
    <defs>
      <mask id="hole">
        <rect x="-400" y="-400" width="800" height="800" fill="#fff"/>
        <g class="blades"><polygon id="hex" points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#000"/></g>
      </mask>
    </defs>
    <rect x="-400" y="-400" width="800" height="800" fill="#141413" mask="url(#hole)"/>
    <g class="blades" stroke="#3A3A37" stroke-width="1.2" fill="none">
      <line x1="0" y1="-60" x2="320" y2="-245"/>
      <line x1="52" y1="-30" x2="372" y2="155"/>
      <line x1="52" y1="30" x2="52" y2="400"/>
      <line x1="0" y1="60" x2="-320" y2="245"/>
      <line x1="-52" y1="30" x2="-372" y2="-155"/>
      <line x1="-52" y1="-30" x2="-52" y2="-400"/>
    </g>
  </svg>
</div>

<script>
(function(){
  requestAnimationFrame(function(){ document.body.classList.add('go'); });

  // gentle tilt of the logo following the pointer (desktop only)
  var wrap=document.getElementById('logo');
  if(window.matchMedia('(hover:hover) and (prefers-reduced-motion:no-preference)').matches){
    window.addEventListener('pointermove',function(e){
      var x=(e.clientX/innerWidth-.5), y=(e.clientY/innerHeight-.5);
      wrap.style.transform='rotateY('+(x*8)+'deg) rotateX('+(-y*8)+'deg)';
    });
  }
})();
</script>
</body>
</html>
